<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sem conexão - Harmonia</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #a0a0a0; font-size: 14px; max-width: 320px; }
  button {
    margin-top: 20px;
    padding: 10px 24px;
    border-radius: 8px;
    border: none;
    background: #f2f2f2;
    color: #0f0f0f;
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>
<body>
  <h1>Você está offline</h1>
  <p>Não foi possível conectar ao Harmonia. Verifique sua internet e tente novamente. Páginas já visitadas continuam disponíveis.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</body>
</html>
